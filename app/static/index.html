<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure AI Assistant & Tool RAG</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <!-- Marked.js for Markdown parsing (Updated working CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
    /* Custom Markdown & Code Block Styling for Clean Look */
    .prose pre {
        background-color: #0d1117 !important;
        border: 1px solid #30363d;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
        overflow-x: auto;
    }
    .prose code {
        color: #f0f6fc;
        background-color: rgba(110, 118, 129, 0.4);
        padding: 0.2rem 0.4rem;
        border-radius: 0.3rem;
        font-size: 0.875rem;
    }
    .prose pre code {
        background-color: transparent;
        padding: 0;
        color: #e6edf3;
    }
    .prose p {
        margin-bottom: 0.75rem;
        line-height: 1.6;
    }
    .prose ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 0.75rem;
    }
    .prose ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-bottom: 0.75rem;
    }
</style>
</head>

<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 w-3 h-3 rounded-full animate-pulse"></div>
            <h1 class="text-lg font-semibold tracking-wide">Secure Tool-Calling AI Assistant</h1>
        </div>
        <span id="model-badge"
            class="text-xs bg-gray-700 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">Agent:
            Ready</span>
    </header>

    <!-- Main Workspace Layout (Chat Area + Right Sidebar) -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Chat Area (Left / Center) -->
        <div class="flex-1 flex flex-col justify-between h-full overflow-hidden">

            <!-- Chat Messages Container -->
            <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
                <!-- Welcome Message -->
                <div class="flex items-start space-x-3">
                    <div
                        class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">
                        AI
                    </div>
                    <div
                        class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-xl shadow-sm text-sm leading-relaxed">
                        Hello! I am your secure assistant equipped with Calculator, World Clock, and Knowledge Base
                        tools. How can I help you today?
                    </div>
                </div>
            </main>

            <!-- Input Form Footer -->
            <footer class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg shrink-0">
                <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
                    <input type="text" id="user-input"
                        placeholder="Ask something (e.g., 'What is FastAPI?' or calculate)..."
                        class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-gray-100 placeholder-gray-500"
                        autocomplete="off" required>
                    <button type="submit" id="send-btn"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition text-sm flex items-center shadow-md">
                        Send
                    </button>
                </form>
            </footer>
        </div>

        <!-- Right Sidebar (Chat Sessions & History) -->
        <aside class="w-80 bg-gray-800/80 border-l border-gray-700 p-4 flex flex-col hidden md:flex shrink-0">
            <!-- New Chat Button -->
            <button id="new-chat-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-md mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span>New Chat Session</span>
            </button>

            <!-- Session / History Header -->
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">
                Active Sessions & History
            </div>

            <!-- Sessions List Container -->
            <div id="sessions-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Dynamically populated session history items will go here -->
                <div class="text-xs text-gray-500 text-center py-4">No active history yet. Start a conversation!</div>
            </div>

            <!-- Current Session ID Footer info -->
            <div class="pt-3 border-t border-gray-700 text-[11px] text-gray-500 truncate" id="current-session-label">
                Session: None
            </div>
        </aside>
    </div>

    <!-- JavaScript Logic with Session & History Management -->
    <!-- JavaScript Logic with Dynamic Backend Sessions & Auto-Titles -->
    <script>
        // Configure marked to respect single line breaks (\n -> <br>)
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }
        const modelBadge = document.getElementById('model-badge');
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const sessionsList = document.getElementById('sessions-list');
        const currentSessionLabel = document.getElementById('current-session-label');

        // State Management
        let currentSessionId = localStorage.getItem('active_session_id') || null;

        // Initialize UI on load
        updateSessionLabel();
        fetchAndRenderSessions();
        if (currentSessionId) {
            loadSessionHistory(currentSessionId);
        }

        // New Chat Button Handler
        newChatBtn.addEventListener('click', () => {
            currentSessionId = null;
            localStorage.removeItem('active_session_id');
            updateSessionLabel();

            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-xl shadow-sm text-sm leading-relaxed">
                        Started a new session! How can I help you today?
                    </div>
                </div>
            `;
            modelBadge.textContent = 'Agent: Ready';
            fetchAndRenderSessions();
        });

        // Chat Form Submit Handler with Streaming Support
        // Chat Form Submit Handler with Live Streaming Support
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            console.log("1. Sending message:", message);

            appendMessage(message, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = 'Thinking...';
            modelBadge.textContent = 'Agent: Processing...';

            const typingId = appendTypingIndicator();

            try {
                const payload = { message };
                if (currentSessionId) {
                    payload.session_id = currentSessionId;
                }

                console.log("2. Fetching /chat/stream...");
                const res = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log("3. Response status:", res.status);
                removeTypingIndicator(typingId);

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    console.error("Server error data:", errData);
                    appendMessage(errData.detail || 'Error communicating with server.', 'ai', true);
                    modelBadge.textContent = 'Agent: Error';
                    return;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-start space-x-3';
                
                const avatar = document.createElement('div');
                avatar.className = 'rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0 bg-indigo-600 text-white';
                avatar.textContent = 'AI';

                const bubble = document.createElement('div');
                bubble.className = 'rounded-2xl p-4 max-w-3xl shadow-md text-sm leading-relaxed prose prose-invert overflow-x-auto bg-gray-900 border border-gray-800 text-gray-100';
                
                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value, { stream: true });
                    console.log("4. Received chunk text:", text);
                    
                    const lines = text.split('\n\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.replace('data: ', ''));
                                if (data.session_id) {
                                    currentSessionId = data.session_id;
                                    localStorage.setItem('active_session_id', currentSessionId);
                                    updateSessionLabel();
                                }
                                if (data.chunk) {
                                    fullText += data.chunk;
                                    bubble.innerHTML = typeof marked.parse === 'function' ? marked.parse(fullText) : marked(fullText);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                                if (data.provider) {
                                    modelBadge.textContent = `Agent: ${data.provider}`;
                                }
                            } catch (e) {
                                // Ignore partial chunks
                            }
                        }
                    }
                }

                fetchAndRenderSessions();

            } catch (err) {
                console.error("Fetch catch error:", err);
                removeTypingIndicator(typingId);
                appendMessage('Network error occurred.', 'ai', true);
                modelBadge.textContent = 'Agent: Disconnected';
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                userInput.focus();
            }
        });

        // Fetch all sessions from backend API
        async function fetchAndRenderSessions() {
            try {
                const res = await fetch('/sessions');
                const data = await res.json();
                if (res.ok && data.sessions) {
                    renderSessionsList(data.sessions);
                }
            } catch (err) {
                console.error("Failed to fetch sessions:", err);
            }
        }

        // Render Sidebar Sessions List
        function renderSessionsList(sessions) {
            sessionsList.innerHTML = '';

            if (!sessions || sessions.length === 0) {
                sessionsList.innerHTML = `<div class="text-xs text-gray-500 text-center py-4">No active history yet.</div>`;
                return;
            }

            sessions.forEach(session => {
                const sessionId = session.session_id;
                const sessionTitle = session.title || "New Chat";
                const isActive = sessionId === currentSessionId;

                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl cursor-pointer text-xs transition flex items-center justify-between group ${
                    isActive 
                        ? 'bg-indigo-600/30 border border-indigo-500/40 text-gray-100 font-medium' 
                        : 'bg-gray-900/50 hover:bg-gray-700/50 text-gray-300'
                }`;

                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-1 truncate mr-2';
                infoDiv.innerHTML = `
                    <div class="truncate font-medium">${sessionTitle}</div>
                    <div class="text-[10px] text-gray-400 mt-1">ID: ${sessionId.substring(0, 6)}...</div>
                `;
                infoDiv.addEventListener('click', () => {
                    currentSessionId = sessionId;
                    localStorage.setItem('active_session_id', currentSessionId);
                    updateSessionLabel();
                    fetchAndRenderSessions();
                    loadSessionHistory(sessionId);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-400 p-1 rounded transition';
                deleteBtn.title = 'Delete Session';
                deleteBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                `;

                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!confirm("Are you sure you want to delete this chat session?")) return;

                    try {
                        const res = await fetch(`/session/${sessionId}`, { method: 'DELETE' });
                        if (res.ok) {
                            if (sessionId === currentSessionId) {
                                currentSessionId = null;
                                localStorage.removeItem('active_session_id');
                                updateSessionLabel();
                                chatContainer.innerHTML = `
                                    <div class="flex items-start space-x-3">
                                        <div class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
                                        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-xl shadow-sm text-sm leading-relaxed">
                                            Session deleted. Start a new chat or select another history!
                                        </div>
                                    </div>
                                `;
                            }
                            fetchAndRenderSessions();
                        }
                    } catch (err) {
                        console.error("Error deleting session:", err);
                    }
                });

                item.appendChild(infoDiv);
                item.appendChild(deleteBtn);
                sessionsList.appendChild(item);
            });
        }

        // Load specific session history into chat window
        async function loadSessionHistory(sessionId) {
            try {
                const res = await fetch(`/session/${sessionId}`);
                const data = await res.json();

                if (res.ok && data.history) {
                    chatContainer.innerHTML = ''; 
                    data.history.forEach(msg => {
                        if (msg.role === 'user') {
                            appendMessage(msg.content, 'user');
                        } else if (msg.role === 'assistant' && msg.content) {
                            appendMessage(msg.content, 'ai');
                        }
                    });
                }
            } catch (err) {
                console.error("Failed to load session history:", err);
            }
        }

        function appendMessage(text, sender, isError = false) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0 ${isUser ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white'}`;
            avatar.textContent = isUser ? 'U' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-2xl shadow-sm text-sm leading-relaxed prose prose-invert overflow-x-auto ${
                isUser 
                    ? 'bg-emerald-700/30 border border-emerald-600/40 text-gray-100' 
                    : isError 
                        ? 'bg-red-900/30 border border-red-600/40 text-red-200' 
                        : 'bg-gray-800 border border-gray-700 text-gray-100'
            }`;

            if (isUser) {
                bubble.style.whiteSpace = 'pre-wrap';
                bubble.textContent = text;
            } else {
                try {
                    if (typeof marked !== 'undefined') {
                        bubble.innerHTML = typeof marked.parse === 'function' ? marked.parse(text || "") : marked(text || "");
                    } else {
                        bubble.textContent = text;
                    }
                    
                    setTimeout(() => {
                        bubble.querySelectorAll('pre code').forEach((block) => {
                            if (typeof hljs !== 'undefined') hljs.highlightElement(block);
                        });
                    }, 50);
                } catch (err) {
                    bubble.style.whiteSpace = 'pre-wrap';
                    bubble.textContent = text;
                }
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendTypingIndicator() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start space-x-3';

            const avatar = document.createElement('div');
            avatar.className = 'bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0';
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bg-gray-800 border border-gray-700 rounded-2xl p-4 text-sm text-gray-400 animate-pulse';
            bubble.textContent = 'Executing tools & generating response...';

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateSessionLabel() {
            if (currentSessionId) {
                currentSessionLabel.textContent = `Active ID: ${currentSessionId.substring(0, 8)}...`;
            } else {
                currentSessionLabel.textContent = 'Session: New / Unsaved';
            }
        }
    </script>
</body>

</html>
